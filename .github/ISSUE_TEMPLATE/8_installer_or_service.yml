name: "📦 Installer / Downloads & Background Service"
description: "Report problems with the unified installer/uninstaller, gallery downloads, or the background service queue"
title: "📦 [Packaging/Service]: "
labels: ["installer", "service", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        NH Desktop ships a Tauri-native unified installer/uninstaller and an in-app
        background service (gallery downloads, image prefetch, cache maintenance).
        Use this template when those fail.
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which subsystem is failing?"
      options:
        - "Installer (setup wizard, install/reinstall/update)"
        - "Uninstaller (uninstall flow, shortcuts, registry/desktop entry cleanup)"
        - "Maintenance Mode (repair shortcuts, reinstall)"
        - "Gallery Download (zip to disk, progress, failure)"
        - "Background Service Queue (jobs stuck, events missing)"
        - "Image Prefetch / Cache Maintenance"
        - "Separate Installer / App Build (bundling, signing, version sync)"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Which OS are you on?"
      options:
        - "Windows 11 (x86_64)"
        - "Windows 10 (x86_64)"
        - "Linux - Ubuntu / Debian (x86_64 / arm64)"
        - "Linux - Fedora / RHEL (x86_64)"
        - "Linux - Arch / Manjaro (x86_64)"
        - "macOS - Apple Silicon (M1/M2/M3/M4)"
        - "macOS - Intel (x86_64)"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: "NH Desktop Version"
      description: "Version of the installer and app (must match across Cargo.toml / tauri.conf.json / package.json)."
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Problem Description"
      description: "What happened, step by step, and where did it fail?"
      placeholder: "The installer completes but no Start Menu shortcut is created on..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / Screenshots"
      description: "Installer logs, Webview console output, service job errors, or screenshots."
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: verification
    attributes:
      label: "Verification"
      options:
        - label: "I confirmed the version string matches across the installer and the installed app."
          required: true
        - label: "I have enough free disk space where the install/cache/download target lives."
          required: true